{{ define "main" }}
  <section>
    <h1>{{ .Site.Params.Greeting | default "Welcome!" }}</h1>
    <p>{{ .Site.Params.Description | markdownify }}</p>
  </section>

  {{ $pages := where .Site.RegularPages "Section" "in" .Site.MainSections }}
  <h2>All posts</h2>
  {{ partial "page-list.html" $pages }}
{{ end }}
